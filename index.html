<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Kub❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Itim', cursive;
            background: linear-gradient(135deg, #ffb6fd, #ffe4e1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: pop 1s ease;
            max-width: 350px;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { color: #ffacec; font-size: 32px; }
        p { font-size: 20px; color: #555; }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            background: #d988ff;
            color: white;
            cursor: pointer;
        }

        .heart {
            position: absolute;
            color: #ff7ae4;
            font-size: 20px;
            animation: float 4s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        .photo-right {
    width: 140px;      /* 👈 ลดขนาดรูป */
    height: 170px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: block;
    margin: 0 0 12px 0;   /* ชิดซ้าย */
        }
 {
    display: block;
    margin: 0 0 12px 0;   /* ชิดซ้าย */
}

}

    </style>
</head>
<body>

<div class="card">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p id="message">สุขสันต์วันเกิดอายุครบ 18 ปีคับ 💕</p>
    <button onclick="nextPage()">ลองกดดู 💖</button>

</div>

<img id="photo" src="Qr.jpg" class="photo photo-right">

<audio id="music" controls>
    <source src="music.mp3.mp3" type="audio/mpeg">
</audio>


<script>
function nextPage() {
    // เล่นเพลง
    const m = document.getElementById("music");
    m.volume = 1;
    m.muted = false;
    m.play();

    document.getElementById("photo").src = "Qr.jpg";

    // เปลี่ยนข้อความ
    document.getElementById("message").innerHTML =
        "ขอให้มีความสุขมากๆ สุขภาพร่างกายแข็งแรง 💖<br><br>" +
        "อายุ 18 แล้ว โตแล้ว จะทำอะไรก็อยากให้คิดเยอะๆ<br>" +
        "ขอให้คิดอะไรก็สมปรารถนา รวยๆ มีตังเยอะๆ 💸<br>" +
        "ขอให้ได้ไปดูคอนเยอะๆ ใช้ชีวิตให้คุ้ม 🎶<br>" +
        "ขอให้เข้ามหาลัยแล้วมีเพื่อนที่ดี 🤍<br>" +
        "ตั้งใจเรียน มีหน้าที่การงานดีๆ<br>" +
        "เป็นเด็กดีของแม่กับยาย และทุกๆคน 💕";

    // ซ่อนปุ่ม
    document.querySelector("button").style.display = "none";

    // หัวใจลอย
    setInterval(createHeart, 300);
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}
</script>


</body>
</html>
